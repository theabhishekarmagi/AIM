name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK and local configuration
        shell: bash
        run: |
          sdkmanager --licenses < <(yes) > /dev/null
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          cp aura-android/app/google-services.example.json aura-android/app/google-services.json
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > aura-android/local.properties

      - name: Build debug APK and run unit tests
        working-directory: aura-android
        run: |
          bash gradlew --no-daemon --console=plain --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:assembleDebug :app:testDebugUnitTest :mcp-server:test

      - name: Prepare installable artifact
        run: |
          mkdir -p artifacts
          cp aura-android/app/build/outputs/apk/debug/app-debug.apk artifacts/AIM-debug.apk
          printf '%s\n' "$GITHUB_SHA" > artifacts/SOURCE_COMMIT.txt
          cd artifacts
          sha256sum AIM-debug.apk > SHA256SUMS

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: AIM-debug-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-unit-test-results-${{ github.run_number }}
          path: |
            aura-android/app/build/test-results/
            aura-android/app/build/reports/tests/
            aura-android/mcp-server/build/test-results/
            aura-android/mcp-server/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
